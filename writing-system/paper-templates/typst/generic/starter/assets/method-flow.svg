<?xml version="1.0" encoding="UTF-8"?>
<!-- 方法步骤**占位**示意图（除 1–4 外为纯几何，避免依赖本机字体）。
     方框 1–4 与虚线箭头都是占位形状，图注只说它们是占位步骤；
     编辑时可把方框换成自己的步骤文字并同步图注。改完重新编译即可。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="140" viewBox="0 0 520 140">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#484848"/>
    </marker>
  </defs>
  <g fill="#f5f5f5" stroke="#484848" stroke-width="1.2">
    <rect x="8" y="40" width="100" height="56" rx="3"/>
    <rect x="142" y="40" width="100" height="56" rx="3"/>
    <rect x="276" y="40" width="100" height="56" rx="3"/>
    <rect x="410" y="40" width="100" height="56" rx="3"/>
  </g>
  <g stroke="#484848" stroke-width="1.4" marker-end="url(#arrow)">
    <line x1="108" y1="68" x2="138" y2="68"/>
    <line x1="242" y1="68" x2="272" y2="68"/>
    <line x1="376" y1="68" x2="406" y2="68"/>
  </g>
  <g fill="#484848" font-family="DejaVu Sans, sans-serif" font-size="13" text-anchor="middle">
    <text x="58" y="74">1</text>
    <text x="192" y="74">2</text>
    <text x="326" y="74">3</text>
    <text x="460" y="74">4</text>
  </g>
  <path d="M326 40 L326 16 L192 16 L192 36" fill="none" stroke="#8a9099"
        stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>
