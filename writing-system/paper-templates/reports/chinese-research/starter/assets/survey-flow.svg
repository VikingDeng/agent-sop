<?xml version="1.0" encoding="UTF-8"?>
<!-- 调研流程**占位**示意图（除 1–4 外为纯几何，避免依赖本机字体）。
     方框 1–4 与虚线箭头都是占位形状，图注只说它们是占位步骤；
     编辑时可把方框换成自己的步骤文字并同步图注。改完重新编译即可。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="120" viewBox="0 0 520 120">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#484848"/>
    </marker>
  </defs>
  <g fill="#f6f6f4" stroke="#8a4b2a" stroke-width="1.2">
    <rect x="8" y="32" width="100" height="56" rx="3"/>
    <rect x="142" y="32" width="100" height="56" rx="3"/>
    <rect x="276" y="32" width="100" height="56" rx="3"/>
    <rect x="410" y="32" width="100" height="56" rx="3"/>
  </g>
  <g stroke="#484848" stroke-width="1.4" marker-end="url(#arrow)">
    <line x1="108" y1="60" x2="138" y2="60"/>
    <line x1="242" y1="60" x2="272" y2="60"/>
    <line x1="376" y1="60" x2="406" y2="60"/>
  </g>
  <g fill="#8a4b2a" font-family="DejaVu Sans, sans-serif" font-size="13" text-anchor="middle">
    <text x="58" y="66">1</text>
    <text x="192" y="66">2</text>
    <text x="326" y="66">3</text>
    <text x="460" y="66">4</text>
  </g>
  <path d="M460 92 L460 108 L58 108 L58 92" fill="none" stroke="#d2d2d2"
        stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>
