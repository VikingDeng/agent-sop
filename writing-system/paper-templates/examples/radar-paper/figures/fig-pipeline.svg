<?xml version="1.0" encoding="UTF-8"?>
<!--
  fig-pipeline.svg — architecture diagram for the example paper.

  Deliberately hand-written with PRESENTATION ATTRIBUTES ONLY (no <style>
  block, no CSS classes): the Typst SVG renderer does not apply CSS, so a
  stylesheet-based SVG that looks right in a browser renders unstyled here.
  If you author figures in Inkscape/Illustrator, re-save with
  "Inline attributes" / "Presentation attributes" for the same reason.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250"
     viewBox="0 0 900 250">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- ================= top branch: physics prior ================= -->
  <rect x="30" y="40" width="150" height="54" rx="6"
        fill="#f2f4f7" stroke="#333333" stroke-width="1.4"/>
  <text x="105" y="63" font-family="Libertinus Serif, serif" font-size="15"
        fill="#111111" text-anchor="middle">Scenario</text>
  <text x="105" y="82" font-family="Libertinus Serif, serif" font-size="15"
        fill="#111111" text-anchor="middle" font-style="italic">s</text>

  <line x1="180" y1="67" x2="232" y2="67" stroke="#333333" stroke-width="1.4"
        marker-end="url(#arrow)"/>

  <rect x="240" y="40" width="210" height="54" rx="6"
        fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
  <text x="345" y="63" font-family="Libertinus Serif, serif" font-size="15"
        fill="#111111" text-anchor="middle">Physics prior</text>
  <text x="345" y="83" font-family="Libertinus Serif, serif" font-size="15"
        fill="#111111" text-anchor="middle" font-style="italic">F(θ+Δθ, s)</text>

  <!-- ================= bottom branch: residual generator ================= -->
  <rect x="30" y="165" width="150" height="54" rx="6"
        fill="#f2f4f7" stroke="#333333" stroke-width="1.4"/>
  <text x="105" y="188" font-family="Libertinus Serif, serif" font-size="15"
        fill="#111111" text-anchor="middle">Support set</text>
  <text x="105" y="207" font-family="Libertinus Serif, serif" font-size="15"
        fill="#111111" text-anchor="middle" font-style="italic">K measured frames</text>

  <line x1="180" y1="192" x2="232" y2="192" stroke="#333333" stroke-width="1.4"
        marker-end="url(#arrow)"/>

  <rect x="240" y="165" width="210" height="54" rx="6"
        fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
  <text x="345" y="188" font-family="Libertinus Serif, serif" font-size="15"
        fill="#111111" text-anchor="middle">Residual generator</text>
  <text x="345" y="208" font-family="Libertinus Serif, serif" font-size="15"
        fill="#111111" text-anchor="middle" font-style="italic">G(φ) → R̂</text>

  <!-- ================= merge ================= -->
  <line x1="450" y1="67" x2="500" y2="67" stroke="#333333" stroke-width="1.4"/>
  <line x1="500" y1="67" x2="500" y2="118" stroke="#333333" stroke-width="1.4"/>
  <line x1="450" y1="192" x2="500" y2="192" stroke="#333333" stroke-width="1.4"/>
  <line x1="500" y1="192" x2="500" y2="142" stroke="#333333" stroke-width="1.4"/>

  <circle cx="520" cy="130" r="21" fill="#ffffff" stroke="#1f3a5f"
          stroke-width="1.8"/>
  <text x="520" y="137" font-family="Libertinus Serif, serif" font-size="19"
        fill="#1f3a5f" text-anchor="middle">⊕</text>

  <line x1="541" y1="130" x2="596" y2="130" stroke="#1f3a5f" stroke-width="1.6"
        marker-end="url(#arrow)"/>

  <!-- ================= output chain ================= -->
  <rect x="604" y="103" width="160" height="54" rx="6"
        fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
  <text x="684" y="126" font-family="Libertinus Serif, serif" font-size="15"
        fill="#111111" text-anchor="middle">Range–Doppler</text>
  <text x="684" y="146" font-family="Libertinus Serif, serif" font-size="15"
        fill="#111111" text-anchor="middle" font-style="italic">D(·)</text>

  <line x1="764" y1="130" x2="812" y2="130" stroke="#333333" stroke-width="1.4"
        marker-end="url(#arrow)"/>

  <rect x="820" y="103" width="60" height="54" rx="6"
        fill="#eef3f8" stroke="#1f3a5f" stroke-width="1.6"/>
  <text x="850" y="137" font-family="Libertinus Serif, serif" font-size="18"
        fill="#1f3a5f" text-anchor="middle" font-style="italic">x̂</text>

</svg>
