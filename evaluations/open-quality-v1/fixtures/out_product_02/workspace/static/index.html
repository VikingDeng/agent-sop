<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Experiment Galaxy</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="hero">
      <span class="eyebrow">EXPERIMENT GALAXY</span>
      <h1>Ship experiments at the speed of imagination.</h1>
      <p>One radiant command center for every run, metric, and breakthrough.</p>
      <button>Launch a magical run</button>
    </header>
    <main>
      <section>
        <h2>Your latest experiments</h2>
        <div id="runs" class="card-grid"></div>
      </section>
      <section class="compare-card">
        <h2>Quick comparison</h2>
        <div id="comparison">Pick two runs to reveal the winner.</div>
      </section>
      <section class="details-card">
        <h2>Run details</h2>
        <pre id="details">Select a card.</pre>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
