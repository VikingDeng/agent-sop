name: Agentic RL TopConf 2025-2026 Batch 2

on:
  push:
    branches:
      - automation/agentic-rl-pdf-transfer-2026-08-07
    paths:
      - .github/workflows/agentic-rl-topconf-2025-2026-batch2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    name: download-${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [core, adjacent]

