and Amit Jain and Suresh K. Venkatasubramanian and Diyi Yang and Chi Jin and Yixuan Li and Bo Li", "first_author": "Zhuge", "venue_year": 2025, "publication_label": "ICML 2025", "decision": "ADJACENT", "priority": "P2", "category": "agent_foundations_benchmarks", "source_url": "https://arxiv.org/pdf/2410.10934", "filename": "2025_Zhuge_Agent-as-a-Judge_ICML-2025_arXiv-2410.10934.pdf", "library_path": "/Agentic RL/10_Papers/2025/2025_Zhuge_Agent-as-a-Judge_ICML-2025_arXiv-2410.10934.pdf"}, {"id": "2406.07155", "title": "Scaling Large Language Model-based Multi-Agent Collaboration", "author": "Chen Qian and Zihao Xie and Yifei Wang and Wei Liu and Jiashuo Liu and Yining Shi and Lingrui Mei and Jianmin Liu and Chen Lin and Yuhao Zhang and Zhiyuan Liu and Maosong Sun", "first_author": "Qian", "venue_year": 2025, "publication_label": "ICLR 2025", "decision": "ADJACENT", "priority": "P2", "category": "llm_multi_agent", "source_url": "https://arxiv.org/pdf/2406.07155", "filename": "2025_Qian_Scaling-LLM-Multi-Agent-Collaboration_ICLR-2025_arXiv-2406.07155.pdf", "library_path": "/Agentic RL/10_Papers/2025/2025_Qian_Scaling-LLM-Multi-Agent-Collaboration_ICLR-2025_arXiv-2406.07155.pdf"}, {"id": "2412.21139", "title": "Training Software Engineering Agents and Verifiers with SWE-Gym", "author": "Jiayi Pan and Xingyao Wang and Graham Neubig and Navdeep Jaitly and Heng Ji and Alane Suhr", "first_author": "Pan", "venue_year": 2025, "publication_label": "ICML 2025", "decision": "ADJACENT", "priority": "P2", "category": "agent_learning_adjacent", "source_url": "https://arxiv.org/pdf/2412.21139", "filename": "2025_Pan_SWE-Gym_ICML-2025_arXiv-2412.21139.pdf", "library_path": "/Agentic RL/10_Papers/2025/2025_Pan_SWE-Gym_ICML-2025_arXiv-2412.21139.pdf"}]''')
          group = os.environ["GROUP"].upper()
          papers = [p for p in papers if p["decision"] == group]

          root = Path("bundle")
          root.mkdir(parents=True, exist_ok=True)
          headers = {
              "User-Agent": "Mozilla/5.0 AgenticRL-Library-Curator/2026.08"
          }

          def download_one(paper):
              out_dir = root / str(paper["venue_year"])
              out_dir.mkdir(parents=True, exist_ok=True)
              dest = out_dir / paper["filename"]
              urls = [paper["source_url"]]
              if not paper["id"].startswith("local"):
                  urls.extend([
                      f"https://arxiv.org/pdf/{paper['id']}.pdf",
                      f"https://export.arxiv.org/pdf/{paper['id']}",
                  ])

              last_error = None
              for attempt in range(1, 7):
                  for url in urls:
                      tmp = dest.with_suffix(dest.suffix + ".part")
                      try:
                          with requests.get(
                              url,
                              headers=headers,
                              stream=True,
                              allow_redirects=True,
                              timeout=(25, 240),
                          ) as response:
                              response.raise_for_status()
                              with tmp.open("wb") as handle:
                                  for chunk in response.iter_content(chunk_size=1024 * 1024):
                                      if chunk:
                                          handle.write(chunk)
                          if tmp.stat().st_size < 10_000:
                              raise RuntimeError(f"file too small: {tmp.stat().st_size} bytes")
                          with tmp.open("rb") as handle:
                              if handle.read(5) != b"%PDF-":
                                  raise RuntimeError("response is not a PDF")
                          tmp.replace(dest)
                          reader = PdfReader(str(dest), strict=False)
                          pages = len(reader.pages)
                          if pages < 1:
                              raise RuntimeError("zero-page PDF")
                          digest = hashlib.sha256(dest.read_bytes()).hexdigest()
                          return {
                              **paper,
                              "status": "validated",
                              "pages": pages,
                              "size_bytes": dest.stat().st_size,
                              "sha256": digest,
                              "resolved_url": response.url,
                          }
                      except Exception as exc:
                          last_error = f"attempt={attempt} url={url} error={type(exc).__name__}: {exc}"
                          if tmp.exists():
                              tmp.unlink()
                  time.sleep(min(30, 2 ** attempt) + random.random() * 2)

              return {**paper, "status": "failed", "error": last_error}

          started = time.time()
          max_workers = min(8, max(1, len(papers)))
          results = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=max_workers) as pool:
              future_to_paper = {pool.submit(download_one, p): p for p in papers}
              for future in concurrent.futures.as_completed(future_to_paper):
                  result = future.result()
                  results.append(result)
                  print(
                      f"[{result['status']}] {result['id']} "
                      f"{result.get('pages', '-')} pages "
                      f"{result.get('size_bytes', '-')} bytes",
                      flush=True,
                  )

          results.sort(key=lambda x: (x["venue_year"], x["decision"], x["filename"]))
          failures = [r for r in results if r["status"] != "validated"]
          manifest = {
              "batch": "topconf-2025-2026-batch2",
              "group": group,
              "planned": len(papers),
              "validated": len(results) - len(failures),
              "failed": len(failures),
              "elapsed_seconds": round(time.time() - started, 2),
              "concurrency": max_workers,
              "papers": results,
          }
          (root / f"download_manifest_{group.lower()}.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          (root / "README.txt").write_text(
              "Agentic RL 2025-2026 top-conference PDF batch. "
              "All successful files passed PDF signature, parse, page-count, and SHA-256 checks.\n",
              encoding="utf-8",
          )

          print(json.dumps({
              "group": group,
              "planned": len(papers),
              "validated": len(results) - len(failures),
              "failed": len(failures),
              "elapsed_seconds": manifest["elapsed_seconds"],
          }, indent=2))
          if failures:
              raise SystemExit("Some downloads failed: " + ", ".join(r["id"] for r in failures))
          PY

      - name: Upload validated PDF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentic-rl-topconf-2025-2026-batch2-${{ matrix.group }}
          path: bundle
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
